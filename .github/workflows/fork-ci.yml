# Fork-only CI: builds the `dev` branch.
#
# This file does not exist upstream. It is added on the fork because the
# upstream workflow cannot build a fork's own branches:
#
#   * its push trigger only listens on `main`
#   * its "Create Sign File" step needs the maintainer's keystore secrets
#     (KEY_STORE_PASSWORD / ALIAS / SIGNING_KEY), which a fork does not have.
#     With them empty it still creates signing.properties, and the build then
#     dies with "Cannot convert '' to File" -- a fork must NOT create that file
#     so the build falls back to debug signing.
#
# So this workflow only injects the two secrets needed to fetch the private
# fan.miuix / hyperceiler-expansion packages.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   GIT_ACTOR : your GitHub username
#   GIT_TOKEN : a token with read:packages

name: Fork CI

# The build only reads the repository; publishing the canary release needs to
# write releases, so contents: write is required. This uses the automatic
# GITHUB_TOKEN of the run, never a personal access token.
permissions:
  contents: write

on:
  push:
    branches: [dev]
    paths-ignore:
      - "*.md"
  workflow_dispatch:

# Pushing several commits in a row would otherwise queue a run for each one;
# keep only the newest run per branch.
concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_dev:
    name: Build dev (canary)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # versionCode is derived from the commit count, so full history is
          # required or the APK gets a bogus (very low) version code.
          fetch-depth: 0
          submodules: true

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build canary
        env:
          GIT_ACTOR: ${{ secrets.GIT_ACTOR }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: ./gradlew assembleCanary

      - name: Show APK
        run: |
          ls -l app/build/outputs/apk/canary/
          shasum -a 256 app/build/outputs/apk/canary/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: HyperCeiler-dev-canary
          path: app/build/outputs/apk/canary/*.apk
          compression-level: 9

      # Every build gets its own release, and old ones are never touched, so the
      # Releases page keeps a full history of canary APKs.
      #
      # GitHub requires a release to be anchored to a tag, so each build gets a
      # tag named after the build itself (canary-<versionName>-r<versionCode>).
      # Nothing in the source tree is tagged and no version tags are created.
      - name: Publish a canary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/canary/*.apk | head -n1)
          NAME=$(basename "$APK")
          # HyperCeiler-<versionName>-<shortSha>-r<versionCode>-canary.apk
          #              -> HyperCeiler-canary-<versionName>-r<versionCode>.apk
          VER=$(printf '%s' "$NAME" | sed -E 's/^HyperCeiler-(.+)-[0-9a-f]+-r([0-9]+)-canary\.apk$/\1-r\2/')
          ASSET="HyperCeiler-canary-${VER}.apk"
          TAG="canary-${VER}"
          SHA=$(shasum -a 256 "$APK" | awk '{print $1}')
          NOTES=$(printf 'Automated canary build.\n\n- commit: `%s`\n- APK: `%s`\n- sha256: `%s`\n\nDebug-signed; uninstall the official build before installing.\n' "$GITHUB_SHA" "$ASSET" "$SHA")
          cp "$APK" "$ASSET"
          # Ask the API instead of `gh release view`: gh also looks at local tags,
          # which actions/checkout may have left behind from an earlier release.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            # Same commit rebuilt (a re-run): refresh that release in place.
            gh release upload "$TAG" "$ASSET" --clobber
          else
            # A stale local tag makes `gh release create` refuse with "tag exists
            # locally but has not been pushed", so drop it and let gh recreate it
            # at the commit that was just built.
            git tag -d "$TAG" >/dev/null 2>&1 || true
            gh release create "$TAG" --target "$GITHUB_SHA" --latest \
              --title "HyperCeiler canary ${VER}" --notes "$NOTES" "$ASSET"
          fi
          echo "release: $(gh release view "$TAG" --json url -q .url)"
